services:
  - type: web
    name: tcg-backend-api
    env: node
    rootDir: api
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: tcg-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 1d
      - key: MANAPOOL_ACCESS_TOKEN
        sync: false
# Databases (Optional: Remove if using external DB)
databases:
  - name: tcg-postgres
    databaseName: tcg_db
    user: tcg_user
